name: Offline portfolio validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run disclosed synthetic tests
        run: python3 -m tools.validate --out validation-local
      - name: Inspect release files and reachable history
        run: python3 -m tools.audit_release
